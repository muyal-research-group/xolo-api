name: Monorepo CI

on:
  pull_request:
  workflow_dispatch:
  push:

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      XOLO_PLATFORM_BOOTSTRAP_PASSWORD: ci-bootstrap-password
    services:
      mongo:
        image: mongo:7
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: pip install poetry==2.2.1

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run test suite with coverage
        run: |
          poetry run coverage run -m pytest
          poetry run coverage xml
          poetry run coverage report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  client-tests:
    name: Client tests
    runs-on: ubuntu-latest
    env:
      XOLO_OUTPUT_PATH: ${{ runner.temp }}/xolo-client-data
      XOLO_LOG_PATH: ${{ runner.temp }}/xolo-client-logs
    permissions:
      contents: read
    defaults:
      run:
        working-directory: xolo-client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: pip install poetry==2.2.1

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run all client tests
        run: poetry run pytest -q

      - name: Build client distributions
        run: poetry build

  ui-build:
    name: UI build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: xolo-ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: xolo-ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  docs-build:
    name: Zensical docs
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: pip install poetry==2.2.1

      - name: Install API docs dependencies
        run: poetry install --with docs

      - name: Install client docs dependencies
        working-directory: xolo-client
        run: poetry install --no-interaction

      - name: Build API documentation
        run: poetry run zensical build -f zensical.toml

      - name: Build client documentation
        working-directory: xolo-client
        run: poetry run zensical build -f zensical.toml
