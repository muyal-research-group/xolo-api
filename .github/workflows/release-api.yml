name: Release API image

on:
  push:
    tags:
      - "api-v*"

permissions:
  contents: read

jobs:
  verify-and-test:
    name: Verify version and test API
    runs-on: ubuntu-latest
    env:
      XOLO_PLATFORM_BOOTSTRAP_PASSWORD: ci-bootstrap-password
    services:
      mongo:
        image: mongo:7
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      stable: ${{ steps.version.outputs.stable }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: pip install poetry==2.2.1

      - name: Verify release version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#api-v}"
          PACKAGE_VERSION="$(poetry version --short)"
          test "$VERSION" = "$PACKAGE_VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run API tests
        run: poetry run pytest

  publish-image:
    name: Publish API image
    needs: verify-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            XOLO_VERSION=${{ needs.verify-and-test.outputs.version }}
          tags: |
            nachocode/xolo:api-${{ needs.verify-and-test.outputs.version }}

      - name: Tag stable API image as latest
        if: needs.verify-and-test.outputs.stable == 'true'
        run: >-
          docker buildx imagetools create
          --tag nachocode/xolo:api-latest
          nachocode/xolo:api-${{ needs.verify-and-test.outputs.version }}
