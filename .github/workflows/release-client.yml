name: Release Python client

on:
  push:
    tags:
      - "client-v*"

permissions:
  contents: read

jobs:
  build:
    name: Test and build client
    runs-on: ubuntu-latest
    env:
      XOLO_OUTPUT_PATH: $GITHUB_WORKSPACE/xolo-client-data
      XOLO_LOG_PATH: $GITHUB_WORKSPACE/xolo-client-logs
    defaults:
      run:
        working-directory: xolo-client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: pip install poetry==2.2.1

      - name: Verify release version
        run: |
          VERSION="${GITHUB_REF_NAME#client-v}"
          test "$VERSION" = "$(poetry version --short)"

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run client tests
        run: poetry run pytest tests/client/test_client_contracts.py -q

      - name: Build wheel and source distribution
        run: poetry build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: xolo-client-distributions
          path: xolo-client/dist/
          if-no-files-found: error

  publish:
    name: Publish client to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/xolo/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: xolo-client-distributions
          path: dist/

      - name: Publish through PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
